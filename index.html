    <!-- Google AdSense Live Script Auto-Loader -->

    <!-- Global Vite HMR WebSocket Suppressor -->
    <script>
      (function() {
        // Intercept native WebSocket constructor to prevent Vite client from attempting WS connections in container sandbox
        var NativeWS = window.WebSocket;
        if (NativeWS) {
          function PatchedWS(url, protocols) {
            var urlStr = String(url || '');
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            if (urlStr.includes('vite') || protoStr.includes('vite') || urlStr.includes('ws://') || urlStr.includes('wss://')) {
              var fakeWS = {
                readyState: 3, // CLOSED
                bufferedAmount: 0,
                extensions: '',
                protocol: '',
                url: urlStr,
                binaryType: 'blob',
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() {},
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null
              };
              setTimeout(function() {
                if (typeof fakeWS.onclose === 'function') {
                  try { fakeWS.onclose({ wasClean: true, code: 1000, reason: 'HMR Disabled' }); } catch(e) {}
                }
              }, 10);
              return fakeWS;
            }
            return new NativeWS(url, protocols);
          }
          PatchedWS.prototype = NativeWS.prototype;
          PatchedWS.CONNECTING = 0;
          PatchedWS.OPEN = 1;
          PatchedWS.CLOSING = 2;
          PatchedWS.CLOSED = 3;
          window.WebSocket = PatchedWS;
        }

        // Global unhandled rejection and error suppression for Vite WebSocket events
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = '';
          if (typeof reason === 'string') {
            msg = reason;
          } else if (reason && typeof reason === 'object') {
            msg = (reason.message || '') + ' ' + (reason.reason || '') + ' ' + (reason.type || '') + ' ' + (reason.name || '');
            try { msg += ' ' + JSON.stringify(reason); } catch(e) {}
          }
          if (!msg || msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('vite') || msg.includes('closed without opened')) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          var target = event.target;
          if (
            msg.includes('WebSocket') ||
            msg.includes('websocket') ||
            msg.includes('vite') ||
            (target && target.tagName === 'SCRIPT' && target.src && target.src.includes('vite'))
          ) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();

      // Automatically load custom AdSense Publisher ID if set in localStorage
      (function() {
        try {
          var savedPubId = localStorage.getItem("cvcraft_adsense_pub_id");
          if (savedPubId && savedPubId !== "ca-pub-1642294829104829") {
            var script = document.createElement("script");
            script.async = true;
            script.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + encodeURIComponent(savedPubId);
            script.crossOrigin = "anonymous";
            document.head.appendChild(script);
          }
        } catch (e) {
          console.error("AdSense dynamic load error", e);
        }
      })();
    </script>

  <body>
    <div id="google_translate_element" style="display:none"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          autoDisplay: false
        }, 'google_translate_element');
      }

      // Proactively and aggressively hide the Google Translate top bar & restore spacing in the DOM
      (function() {
        function cleanGoogleTranslate() {
          try {
            // Find all Google Translate elements, iframes, and widgets
            var translateClasses = ['skiptranslate', 'goog-te-banner-frame', 'goog-te-banner', 'goog-te-balloon-frame', 'goog-tooltip', 'goog-tooltip-back'];
            for (var c = 0; c < translateClasses.length; c++) {
              var elms = document.getElementsByClassName(translateClasses[c]);
              for (var i = 0; i < elms.length; i++) {
                var el = elms[i];
                if (el.id !== 'google_translate_element') {
                  el.style.setProperty('display', 'none', 'important');
                  el.style.setProperty('visibility', 'hidden', 'important');
                  el.style.setProperty('height', '0px', 'important');
                  el.style.setProperty('opacity', '0', 'important');
                }
              }
            }

            // Find any iframes matching Google Translate selectors
            var iframes = document.getElementsByTagName('iframe');
            for (var j = 0; j < iframes.length; j++) {
              var iframe = iframes[j];
              if (iframe.className.indexOf('goog-te-banner') > -1 || 
                  iframe.className.indexOf('skiptranslate') > -1 || 
                  iframe.id.indexOf('goog-te') > -1 ||
                  (iframe.src && iframe.src.indexOf('translate') > -1)) {
                iframe.style.setProperty('display', 'none', 'important');
                iframe.style.setProperty('visibility', 'hidden', 'important');
                iframe.style.setProperty('height', '0px', 'important');
                iframe.style.setProperty('opacity', '0', 'important');
              }
            }

            // Reset body/html positioning styles that Google Translate pushes down
            if (document.body) {
              if (document.body.style.top !== '0px' && document.body.style.top !== '') {
                document.body.style.setProperty('top', '0px', 'important');
              }
              if (document.body.style.marginTop !== '0px' && document.body.style.marginTop !== '') {
                document.body.style.setProperty('margin-top', '0px', 'important');
              }
              if (document.body.style.paddingTop !== '0px' && document.body.style.paddingTop !== '') {
                document.body.style.setProperty('padding-top', '0px', 'important');
              }
            }
            if (document.documentElement) {
              if (document.documentElement.style.top !== '0px' && document.documentElement.style.top !== '') {
                document.documentElement.style.setProperty('top', '0px', 'important');
              }
              if (document.documentElement.style.marginTop !== '0px' && document.documentElement.style.marginTop !== '') {
                document.documentElement.style.setProperty('margin-top', '0px', 'important');
              }
              if (document.documentElement.style.paddingTop !== '0px' && document.documentElement.style.paddingTop !== '') {
                document.documentElement.style.setProperty('padding-top', '0px', 'important');
              }
            }
          } catch (e) {
            // Silently absorb any errors in cleaner loop
          }
        }

        // Periodically run clean up
        setInterval(cleanGoogleTranslate, 100);

        // Run instantly when content or attributes change
        if (typeof MutationObserver !== 'undefined') {
          var observer = new MutationObserver(cleanGoogleTranslate);
          observer.observe(document.documentElement, {
            attributes: true,
            childList: true,
            subtree: true,
            attributeFilter: ['style', 'class']
          });
        }
      })();
    </script>
